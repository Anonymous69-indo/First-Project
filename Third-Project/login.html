<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <style>
      a {
        text-decoration: none;
        color: #6c757d;
      }
      a:hover {
        text-decoration: underline;
      }
      .strength-meter {
        height: 6px;
        background: #e9ecef;
        border-radius: 3px;
        margin-top: 8px;
        overflow: hidden;
      }
      .strength-meter-bar {
        height: 100%;
        width: 0;
        background: #dc3545;
        transition:
          width 0.2s ease,
          background-color 0.2s ease;
      }
    </style>
  </head>
  <body>
    <div
      class="container-fluid d-flex justify-content-center align-items-center"
      style="height: 100vh"
      id="container"
    >
      <div class="section-log">
        <div class="card p-4 shadow" style="width: 400px">
          <h2 class="text-center mb-4" id="Log">Log In</h2>
          <form>
            <div class="mb-3" id="Email">
              <label for="email-username" id="email" class="form-label"
                >Email or Username</label
              >
              <input
                type="text"
                class="form-control"
                id="email-username"
                placeholder="Enter your email or username"
              />
              <div id="email-check" class="invalid-feedback">This form must be fill</div>
            </div>
            <div class="mb-3" id="Username">
              <!--    <label for="email-username" id="email" class="form-label">Email or Username</label>
                        <input type="text" class="form-control" id="email-username" placeholder="Enter your email or username"> -->
            </div>
            <div class="mb-3" id="Password">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password3"
                placeholder="Enter your password"
              />
              <div id="pw-check" class="invalid-feedback">This form must be fill</div>
            </div>
            <div class="mb-3" id="re-password">
              <!--    <label for="re-password" class="form-label">Re-enter Password</label>
                        <input type="password" class="form-control" id="re-password" placeholder="Re-enter your password"> -->
            </div>
            <button type="submit" class="btn btn-primary w-100" id="submit">
              Log in
            </button>
            <a
              href="#"
              class="d-block text-center mt-3 text-muted"
              id="forgot-password"
              >Forgot Password?</a
            >
            <a
              href="#"
              class="d-block text-center mt-2 text-muted"
              id="create-account"
              >Create Account</a
            >
          </form>
        </div>
      </div>
    </div>
    <script>
      const Log = document.getElementById("Log");
      const email = document.getElementById("Email");
      const username = document.getElementById("Username");
      const password = document.getElementById("Password");
      const rePassword = document.getElementById("re-password");
      const log = document.getElementById("Log");
      const submit = document.getElementById("submit");
      const forgotPassword = document.getElementById("forgot-password");
      const createAccount = document.getElementById("create-account");
      const EmailInput = document.getElementById("email-username");
      const PasswordInput = document.getElementById("password3");
      const RePasswordInput = document.getElementById("re-password");
      let event = true;

      function updatePasswordStrength() {
        const passwordInput = document.getElementById("password3");
        const strengthText = document.getElementById("password-strength-text");
        const strengthMeter = document.getElementById(
          "password-strength-meter",
        );
        const strengthBar = document.getElementById("password-strength-bar");
        const value = passwordInput.value;

        const score = [
          value.length >= 8,
          /[a-z]/.test(value),
          /[A-Z]/.test(value),
          /\d/.test(value),
          /[^A-Za-z0-9]/.test(value),
        ].filter(Boolean).length;

        const levels = [
          { label: "Very weak", width: "20%", color: "#dc3545" },
          { label: "Weak", width: "40%", color: "#fd7e14" },
          { label: "Fair", width: "60%", color: "#ffc107" },
          { label: "Good", width: "80%", color: "#0d6efd" },
          { label: "Strong", width: "100%", color: "#198754" },
        ];
        const level = levels[Math.max(score - 1, 0)];

        strengthText.textContent = value
          ? `Password strength: ${level.label}`
          : "Enter a password";
        strengthBar.style.width = value ? level.width : "0";
        strengthBar.style.backgroundColor = level.color;
        strengthMeter.setAttribute(
          "aria-valuenow",
          value ? String(score) : "0",
        );
      }

      createAccount.addEventListener("click", function () {
        if (event) {
          log.innerHTML = "Create Account";
          submit.innerHTML = "Sign Up";
          forgotPassword.style.display = "none";
          email.innerHTML =
            '<label for="email-username" id="email" class="form-label">Email</label><input type="text" class="form-control" id="email-username" placeholder="you@example.com">';
          username.innerHTML =
            '<label for="username" id="username-label" class="form-label">Username</label><input type="text" class="form-control" id="username" placeholder="Enter your username">';
          password.innerHTML =
            '<label for="password3" class="form-label">Password</label><input type="password" class="form-control" id="password3" placeholder="Enter password"><div id="password-strength-text" class="form-text" aria-live="polite">Enter a password</div><div id="password-strength-meter" class="strength-meter" role="progressbar" aria-label="Password strength" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0"><div id="password-strength-bar" class="strength-meter-bar"></div></div>';
          document
            .getElementById("password3")
            .addEventListener("input", updatePasswordStrength);
          rePassword.innerHTML =
            '<label for="re-password" class="form-label">Re-enter Password</label><input type="password" class="form-control" id="re-password" placeholder="Re-enter your password">';
          createAccount.innerHTML = "Already have an account? Log In";
        } else {
          log.innerHTML = "Log In";
          submit.innerHTML = "Log in";
          forgotPassword.style.display = "block";
          email.innerHTML =
            '<label for="email-username" id="email" class="form-label">Email or Username</label><input type="text" class="form-control" id="email-username" placeholder="Enter your email or username">';
          username.innerHTML = "";
          password.innerHTML =
            '<label for="password3" class="form-label">Password</label><input type="password" class="form-control" id="password3" placeholder="Enter your password">';
          rePassword.innerHTML = "";
          createAccount.innerHTML = "Create Account";
        }
        event = !event;
      });

      function validateEmailFormat(email) {
        const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return regex.test(email);
      }
    </script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
